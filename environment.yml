name: fyp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # Data Collection & Web Scraping
    - requests>=2.31.0
    - aiohttp>=3.9.0
    - beautifulsoup4>=4.12.0
    - lxml>=4.9.0
    - selenium>=4.15.0  # If needed for dynamic content
    
    # PDF Processing & OCR
    - pdfplumber>=0.10.0
    - pymupdf>=1.23.0  # PyMuPDF
    - pytesseract>=0.3.10
    - python-doctr>=0.7.0  # docTR for OCR
    
    # Data Processing
    - pandas>=2.1.0
    - numpy>=1.24.0
    - pyarrow>=14.0.0  # For Parquet files
    
    # Database
    - duckdb>=0.9.0
    
    # Data Validation
    - pandera>=0.17.0
    - pydantic>=2.5.0
    - great-expectations>=0.18.0
    
    # Text Processing
    - langdetect>=1.0.9
    - ftfy>=6.1.1
    - unidecode>=1.3.7
    
    # Market Data
    - yfinance>=0.2.28
    
    # Vector Store & RAG
    - faiss-cpu>=1.7.4  # or faiss-gpu if you have CUDA
    - chromadb>=0.4.15
    - sentence-transformers>=2.2.2
    
    # LLM Integration (for open-source models)
    - transformers>=4.35.0
    - torch>=2.1.0
    - accelerate>=0.25.0
    - bitsandbytes>=0.41.0  # For quantization
    
    # Pipeline Orchestration
    - prefect>=2.14.0
    
    # Logging
    - loguru>=0.7.2
    
    # Data Versioning
    - dvc>=3.38.0
    - dvc-s3>=3.0.0  # If using S3 storage
    
    # Configuration Management
    - hydra-core>=1.3.2
    - omegaconf>=2.3.0
    
    # Testing
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
    
    # Jupyter & Notebooks
    - jupyter>=1.0.0
    - ipykernel>=6.26.0
    - notebook>=7.0.0
    
    # Utilities
    - python-dotenv>=1.0.0
    - tqdm>=4.66.0
    - pyyaml>=6.0.1

